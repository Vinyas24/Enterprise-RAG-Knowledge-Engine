name: rag-engine

# Shared by every application container so compose builds the dev image once
# and all services run identical code.
x-app-build: &app-build
  context: .
  target: dev

x-app-environment: &app-environment
  RAG_ENVIRONMENT: ${RAG_ENVIRONMENT:-local}
  RAG_DEBUG: ${RAG_DEBUG:-false}
  RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
  RAG_LOG_FORMAT: ${RAG_LOG_FORMAT:-console}
  # The container always talks to the `postgres` service on its internal port;
  # RAG_DATABASE_URL from `.env` is intentionally not used here.
  RAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag_dev_password}@postgres:5432/${POSTGRES_DB:-rag}
  RAG_DATABASE_POOL_SIZE: ${RAG_DATABASE_POOL_SIZE:-5}
  RAG_DATABASE_MAX_OVERFLOW: ${RAG_DATABASE_MAX_OVERFLOW:-10}
  RAG_DATABASE_POOL_TIMEOUT_SECONDS: ${RAG_DATABASE_POOL_TIMEOUT_SECONDS:-10}
  RAG_DATABASE_POOL_RECYCLE_SECONDS: ${RAG_DATABASE_POOL_RECYCLE_SECONDS:-1800}
  # Only read by pytest (docker compose exec api pytest); the app ignores it.
  # The initdb script creates this database alongside the application one.
  RAG_TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag_dev_password}@postgres:5432/rag_test
  RAG_HEALTH_CHECK_TIMEOUT_SECONDS: ${RAG_HEALTH_CHECK_TIMEOUT_SECONDS:-2}
  RAG_BLOB_STORE_PATH: /data/uploads
  RAG_UPLOAD_MAX_BYTES: ${RAG_UPLOAD_MAX_BYTES:-26214400}
  RAG_CHUNK_SIZE_CHARS: ${RAG_CHUNK_SIZE_CHARS:-1200}
  RAG_CHUNK_OVERLAP_CHARS: ${RAG_CHUNK_OVERLAP_CHARS:-200}
  RAG_CHUNK_STRATEGY: ${RAG_CHUNK_STRATEGY:-recursive}
  RAG_WORKER_POLL_INTERVAL_SECONDS: ${RAG_WORKER_POLL_INTERVAL_SECONDS:-0.5}
  RAG_WORKER_MAX_ATTEMPTS: ${RAG_WORKER_MAX_ATTEMPTS:-3}
  RAG_WORKER_RETRY_BASE_SECONDS: ${RAG_WORKER_RETRY_BASE_SECONDS:-2}
  RAG_WORKER_RETRY_MAX_SECONDS: ${RAG_WORKER_RETRY_MAX_SECONDS:-60}
  RAG_WORKER_VISIBILITY_TIMEOUT_SECONDS: ${RAG_WORKER_VISIBILITY_TIMEOUT_SECONDS:-300}
  RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-deterministic}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
  RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-256}
  RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
  RAG_EMBEDDING_API_BASE: ${RAG_EMBEDDING_API_BASE:-https://api.openai.com/v1}
  RAG_VECTOR_STORE: ${RAG_VECTOR_STORE:-pinecone}
  RAG_PINECONE_API_KEY: ${RAG_PINECONE_API_KEY:-pcsk-local}
  RAG_PINECONE_INDEX_NAME: ${RAG_PINECONE_INDEX_NAME:-rag-engine}
  RAG_PINECONE_CONTROL_HOST: ${RAG_PINECONE_CONTROL_HOST:-http://pinecone:5080}
  RAG_PINECONE_INDEX_HOST: ${RAG_PINECONE_INDEX_HOST:-}
  RAG_RETRIEVAL_TOP_K: ${RAG_RETRIEVAL_TOP_K:-5}
  RAG_RETRIEVAL_MIN_SCORE: ${RAG_RETRIEVAL_MIN_SCORE:-0.0}
  RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-hybrid}
  RAG_HYBRID_DENSE_WEIGHT: ${RAG_HYBRID_DENSE_WEIGHT:-1.0}
  RAG_HYBRID_KEYWORD_WEIGHT: ${RAG_HYBRID_KEYWORD_WEIGHT:-1.0}
  RAG_HYBRID_RRF_K: ${RAG_HYBRID_RRF_K:-60}
  RAG_RETRIEVAL_KEYWORD_CANDIDATES: ${RAG_RETRIEVAL_KEYWORD_CANDIDATES:-200}
  RAG_HYBRID_FALLBACK_ENABLED: ${RAG_HYBRID_FALLBACK_ENABLED:-true}
  RAG_DENSE_RETRIEVAL_TIMEOUT_SECONDS: ${RAG_DENSE_RETRIEVAL_TIMEOUT_SECONDS:-10.0}
  RAG_KEYWORD_RETRIEVAL_TIMEOUT_SECONDS: ${RAG_KEYWORD_RETRIEVAL_TIMEOUT_SECONDS:-10.0}
  RAG_RERANK_PROVIDER: ${RAG_RERANK_PROVIDER:-off}
  RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-}
  RAG_RERANK_CANDIDATES: ${RAG_RERANK_CANDIDATES:-20}
  RAG_RERANK_TIMEOUT_SECONDS: ${RAG_RERANK_TIMEOUT_SECONDS:-5.0}
  RAG_RERANK_API_KEY: ${RAG_RERANK_API_KEY:-}
  RAG_RERANK_API_BASE: ${RAG_RERANK_API_BASE:-https://api.cohere.com/v2}
  RAG_RERANK_BATCH_SIZE: ${RAG_RERANK_BATCH_SIZE:-32}
  RAG_RERANK_DEVICE: ${RAG_RERANK_DEVICE:-}
  RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-deterministic}
  RAG_LLM_MODEL: ${RAG_LLM_MODEL:-gpt-4o-mini}
  RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
  RAG_LLM_API_BASE: ${RAG_LLM_API_BASE:-https://api.openai.com/v1}
  RAG_LLM_TEMPERATURE: ${RAG_LLM_TEMPERATURE:-0.0}
  RAG_GUARDRAILS_ENABLED: ${RAG_GUARDRAILS_ENABLED:-true}
  RAG_GUARDRAILS_MAX_QUERY_LENGTH: ${RAG_GUARDRAILS_MAX_QUERY_LENGTH:-2000}
  RAG_GUARDRAILS_MIN_QUERY_LENGTH: ${RAG_GUARDRAILS_MIN_QUERY_LENGTH:-1}
  RAG_GUARDRAILS_MASK_PII: ${RAG_GUARDRAILS_MASK_PII:-true}
  RAG_GUARDRAILS_DETECT_PROMPT_INJECTION: ${RAG_GUARDRAILS_DETECT_PROMPT_INJECTION:-true}
  RAG_GUARDRAILS_CHECK_GROUNDEDNESS: ${RAG_GUARDRAILS_CHECK_GROUNDEDNESS:-true}
  RAG_GUARDRAILS_MIN_GROUNDEDNESS_SCORE: ${RAG_GUARDRAILS_MIN_GROUNDEDNESS_SCORE:-0.6}
  RAG_GUARDRAILS_VALIDATE_CITATIONS: ${RAG_GUARDRAILS_VALIDATE_CITATIONS:-true}
  RAG_GUARDRAILS_RATE_LIMIT_PER_MINUTE: ${RAG_GUARDRAILS_RATE_LIMIT_PER_MINUTE:-120}
  RAG_GUARDRAILS_AUDIT_LOG_ENABLED: ${RAG_GUARDRAILS_AUDIT_LOG_ENABLED:-true}
  RAG_CACHE_ENABLED: ${RAG_CACHE_ENABLED:-true}
  RAG_CACHE_EMBEDDING_ENABLED: ${RAG_CACHE_EMBEDDING_ENABLED:-true}
  RAG_CACHE_EMBEDDING_MAX_SIZE: ${RAG_CACHE_EMBEDDING_MAX_SIZE:-10000}
  RAG_CACHE_EMBEDDING_TTL_SECONDS: ${RAG_CACHE_EMBEDDING_TTL_SECONDS:-3600.0}
  RAG_CACHE_RETRIEVAL_ENABLED: ${RAG_CACHE_RETRIEVAL_ENABLED:-true}
  RAG_CACHE_RETRIEVAL_MAX_SIZE: ${RAG_CACHE_RETRIEVAL_MAX_SIZE:-2000}
  RAG_CACHE_RETRIEVAL_TTL_SECONDS: ${RAG_CACHE_RETRIEVAL_TTL_SECONDS:-300.0}
  RAG_AUTH_ENABLED: ${RAG_AUTH_ENABLED:-false}
  RAG_API_KEY: ${RAG_API_KEY:-}
  RAG_ADMIN_API_KEY: ${RAG_ADMIN_API_KEY:-}
  RAG_METRICS_ENABLED: ${RAG_METRICS_ENABLED:-true}
  RAG_SERVER_TIMING_ENABLED: ${RAG_SERVER_TIMING_ENABLED:-true}

x-app-volumes: &app-volumes
  # Editable install (PEP 660 .pth) points at /app/src, so host edits are
  # live-reloaded without rebuilding the image.
  - ./src:/app/src
  - ./tests:/app/tests
  - ./alembic:/app/alembic
  - ./alembic.ini:/app/alembic.ini
  - ./pyproject.toml:/app/pyproject.toml
  - ./eval:/app/eval
  # Shared between the API (writer) and the worker (reader).
  - uploads:/data/uploads

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      # Exposed so the API can also be run from the host, and so tests can
      # reach the database directly. Not intended for public networks.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only when the volume is initialised: creates the isolated test DB.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # One-shot migration runner. The API and worker start only after it succeeds,
  # so no service ever serves traffic against a stale schema.
  migrate:
    build: *app-build
    image: rag-engine-dev
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
    # One-shot process; the image healthcheck probes the API port.
    healthcheck:
      disable: true
    restart: "no"

  pinecone:
    image: ghcr.io/pinecone-io/pinecone-local:latest
    ports:
      - "5080:5080"
      - "5081:5081"
      - "5082:5082"
    restart: unless-stopped
    networks:
      default:
        aliases:
          - pinecone
          - pinecone-phase3-test

  api:
    build: *app-build
    image: rag-engine-dev
    command:
      - uvicorn
      - rag_engine.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --no-access-log
    environment: *app-environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
      pinecone:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: *app-build
    image: rag-engine-dev
    command: ["python", "-m", "rag_engine.ingestion.worker"]
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
      pinecone:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    init: true
    # The worker serves no HTTP; the image healthcheck would always fail.
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
